services:
  # Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Microservices
  product-service:
    build: ./microservices/product-service
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/ecommerce?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

  order-service:
    build: ./microservices/order-service
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/ecommerce?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

  user-service:
    build: ./microservices/user-service
    ports:
      - "3004:3004"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/ecommerce?sslmode=disable
    depends_on:
      - db
    networks:
      - app-network

  # BFF
  bff:
    build:
      context: .
      dockerfile: ./bff/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - USER_SERVICE_URL=http://user-service:3004
      - JWT_SECRET=your-secret-key
      - FRONTEND_URL=http://localhost
    depends_on:
      - product-service
      - order-service
      - user-service
    networks:
      - app-network

  # Frontend (served by nginx)
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - bff
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
